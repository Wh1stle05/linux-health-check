
name: Linux Health Checker CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          bash -n health-check.sh
          bash -n lib/inode.sh
          bash -n tests/test-inode.sh

      - name: Run ShellCheck
        run: |
          shellcheck -x -P . health-check.sh lib/inode.sh tests/test-inode.sh

      - name: Run automated tests
        run: |
          bash tests/test-inode.sh
          bash tests/test-inode-collector.sh

      - name: Check Bash syntax
        run: |
          bash -n health-check.sh
          bash -n lib/inode.sh
          bash -n tests/test-inode.sh
          bash -n tests/test-inode-collector.sh

      - name: Run ShellCheck
        run: |
          shellcheck -x -P . \
          health-check.sh \
          lib/inode.sh \
          tests/test-inode.sh \
          tests/test-inode-collector.sh
