
name: Linux Health Checker CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          bash -n health-check.sh
          bash -n tests/inode-test.sh
          bash -n tests/test.sh

      - name: Run ShellCheck
        run: |
          shellcheck health-check.sh
          shellcheck tests/inode-test.sh
          shellcheck -x tests/test.sh

      - name: Run automated tests
        run: |
          bash tests/test.sh
